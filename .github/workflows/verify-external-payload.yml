name: Verify External Homologation Payload

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/oficinaos-v0.9.1-rc1
    paths:
      - '.ci4/**'
      - '.github/workflows/verify-external-payload.yml'

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Rebuild verified tar.xz payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/oficinaos-external-payload.tar.xz
          for i in $(seq 0 3); do
            n=$(printf '%02d' "$i")
            part=".ci4/payload4.part-${n}.b64"
            test -s "$part" || { echo "Missing $part"; exit 1; }
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/oficinaos-external-payload.tar.xz
          done
          xz -t /tmp/oficinaos-external-payload.tar.xz
          sha256sum /tmp/oficinaos-external-payload.tar.xz | tee /tmp/payload.sha256
          echo 'XZ payload integrity: OK'

      - name: Inspect tar payload
        shell: bash
        run: |
          set -euo pipefail
          tar -tJf /tmp/oficinaos-external-payload.tar.xz | tee /tmp/payload-files.txt
          mkdir -p /tmp/payload
          tar -xJf /tmp/oficinaos-external-payload.tar.xz -C /tmp/payload
          ROOT=$(find /tmp/payload -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$ROOT" ]; then ROOT=/tmp/payload; fi
          echo "PAYLOAD_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Payload root: $ROOT"

      - name: Validate CI payload contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PAYLOAD_ROOT"
          test -f "$ROOT/package.json" || { echo "package.json not found"; exit 1; }
          test -f "$ROOT/homologation/fixtures/external-smoke-backup.json" || { echo "smoke fixture not found"; exit 1; }
          test -f "$ROOT/GITHUB_TARGET.md" || { echo "GITHUB_TARGET.md not found"; exit 1; }
          node -e "const p=require(process.env.PAYLOAD_ROOT + '/package.json'); console.log('package', p.name, p.version);"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Payload externo OficinaOS-V1'
            echo
            if [ -f /tmp/payload.sha256 ]; then
              echo '### SHA-256 do tar.xz'
              echo '```'
              cat /tmp/payload.sha256
              echo '```'
            fi
            if [ -f /tmp/payload-files.txt ]; then
              echo '### Conteúdo'
              echo '```'
              cat /tmp/payload-files.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
