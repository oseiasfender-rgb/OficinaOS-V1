name: Verify External Homologation Payload

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/oficinaos-v0.9.1-rc1
    paths:
      - '.ci4/**'
      - '.github/workflows/verify-external-payload.yml'

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Rebuild partial tar.xz stream
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/oficinaos-external-payload.tar.xz
          for i in $(seq 0 3); do
            n=$(printf '%02d' "$i")
            part=".ci4/payload4.part-${n}.b64"
            test -s "$part" || { echo "Missing $part"; exit 1; }
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/oficinaos-external-payload.tar.xz
          done
          echo "Compressed partial bytes: $(wc -c < /tmp/oficinaos-external-payload.tar.xz)"
          if xz -t /tmp/oficinaos-external-payload.tar.xz; then
            echo 'XZ_CONTAINER_COMPLETE=1' >> "$GITHUB_ENV"
          else
            echo 'XZ_CONTAINER_COMPLETE=0' >> "$GITHUB_ENV"
            echo 'XZ container is truncated; attempting content recovery with cryptographic file verification.'
          fi

      - name: Recover decompressed TAR bytes
        shell: bash
        run: |
          set -uo pipefail
          xz -dc /tmp/oficinaos-external-payload.tar.xz > /tmp/recovered.tar 2>/tmp/xz-recovery.err || rc=$?
          rc=${rc:-0}
          echo "xz recovery exit=$rc; recovered bytes=$(wc -c < /tmp/recovered.tar)"
          cat /tmp/xz-recovery.err || true
          test -s /tmp/recovered.tar
          exit 0

      - name: Inspect and extract recoverable files
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/payload
          tar -tvf /tmp/recovered.tar > /tmp/tar-list.txt 2>/tmp/tar-list.err || list_rc=$?
          echo "tar list exit=${list_rc:-0}"
          cat /tmp/tar-list.err || true
          tar -xf /tmp/recovered.tar -C /tmp/payload 2>/tmp/tar-extract.err || extract_rc=$?
          echo "tar extract exit=${extract_rc:-0}"
          cat /tmp/tar-extract.err || true
          find /tmp/payload -type f -printf '%P\n' | sort | tee /tmp/recovered-files.txt
          ROOT=$(find /tmp/payload -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$ROOT" ]; then ROOT=/tmp/payload; fi
          echo "PAYLOAD_ROOT=$ROOT" >> "$GITHUB_ENV"
          exit 0

      - name: Verify recovered core against audited local kit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PAYLOAD_ROOT"
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f GITHUB_TARGET.md
          test -d src
          test -d tests
          test -d scripts
          test -d public
          test -d homologation/fixtures

          find src tests scripts public homologation/fixtures -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/core-files.sha256
          for f in package.json index.html vite.config.js GITHUB_TARGET.md; do sha256sum "$f" >> /tmp/core-files.sha256; done
          sort -k2 /tmp/core-files.sha256 -o /tmp/core-files.sha256
          count=$(wc -l < /tmp/core-files.sha256 | tr -d ' ')
          aggregate=$(sha256sum /tmp/core-files.sha256 | awk '{print $1}')
          echo "core_file_count=$count"
          echo "core_manifest_sha256=$aggregate"
          test "$count" = '83'
          test "$aggregate" = '2eb6f67a0fe4907ec5b517826763c2c6f62ae889209fa4670780f7043ddd8994'

          echo 'Recovered core matches audited local kit exactly.'
          echo "RECOVERED_CORE_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Recuperação do payload externo OficinaOS-V1'
            echo
            echo "- XZ container completo: ${XZ_CONTAINER_COMPLETE:-unknown}"
            echo "- Core recuperado e verificado: ${RECOVERED_CORE_VERIFIED:-0}"
            echo '- Arquivos esperados no core: 83'
            echo '- SHA-256 esperado do manifesto de hashes: `2eb6f67a0fe4907ec5b517826763c2c6f62ae889209fa4670780f7043ddd8994`'
            echo
            if [ -f /tmp/recovered-files.txt ]; then
              echo '### Arquivos recuperados'
              echo '```'
              cat /tmp/recovered-files.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
