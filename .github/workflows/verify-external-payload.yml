name: Verify External Homologation Payload

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/oficinaos-v0.9.1-rc1
    paths:
      - '.ci/**'
      - '.ci4/**'
      - '.github/workflows/verify-external-payload.yml'

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Recover old partial ZIP payload
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/partial.zip
          for i in $(seq 0 9); do
            n=$(printf '%02d' "$i")
            part=".ci/payload.part-${n}.b64"
            test -s "$part" || continue
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/partial.zip || true
          done
          echo "ZIP partial bytes: $(wc -c < /tmp/partial.zip)"
          mkdir -p /tmp/zip-recovered
          timeout 30s zip -FF /tmp/partial.zip --out /tmp/fixed.zip </dev/null > /tmp/zip-ff.log 2>&1 || true
          cat /tmp/zip-ff.log || true
          if [ -s /tmp/fixed.zip ]; then
            unzip -o /tmp/fixed.zip -d /tmp/zip-recovered > /tmp/unzip-fixed.log 2>&1 || true
            cat /tmp/unzip-fixed.log || true
          fi
          find /tmp/zip-recovered -type f -printf '%P\n' | sort | tee /tmp/zip-files.txt

      - name: Recover old partial XZ payload
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/partial.tar.xz
          for i in $(seq 0 3); do
            n=$(printf '%02d' "$i")
            part=".ci4/payload4.part-${n}.b64"
            test -s "$part" || continue
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/partial.tar.xz || true
          done
          echo "XZ partial bytes: $(wc -c < /tmp/partial.tar.xz)"
          xz -dc /tmp/partial.tar.xz > /tmp/recovered.tar 2>/tmp/xz-recovery.err || true
          cat /tmp/xz-recovery.err || true
          mkdir -p /tmp/xz-recovered
          tar -xf /tmp/recovered.tar -C /tmp/xz-recovered 2>/tmp/tar-extract.err || true
          cat /tmp/tar-extract.err || true
          find /tmp/xz-recovered -type f -printf '%P\n' | sort | tee /tmp/xz-files.txt

      - name: Merge recoveries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/merged && mkdir -p /tmp/merged
          ZIPROOT=$(find /tmp/zip-recovered -mindepth 1 -maxdepth 1 -type d | head -n1 || true)
          XZROOT=$(find /tmp/xz-recovered -mindepth 1 -maxdepth 1 -type d | head -n1 || true)
          if [ -n "$ZIPROOT" ]; then cp -a "$ZIPROOT"/. /tmp/merged/; fi
          if [ -n "$XZROOT" ]; then cp -a "$XZROOT"/. /tmp/merged/; fi
          find /tmp/merged -type f -printf '%P\n' | sort | tee /tmp/merged-files.txt
          echo "Merged files: $(wc -l < /tmp/merged-files.txt)"

      - name: Verify merged core against audited local kit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/merged
          test -f package.json
          test -f index.html
          test -f vite.config.js
          test -f GITHUB_TARGET.md
          test -d src
          test -d tests
          test -d scripts
          test -d public
          test -d homologation/fixtures

          find src tests scripts public homologation/fixtures -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/core-files.sha256
          for f in package.json index.html vite.config.js GITHUB_TARGET.md; do sha256sum "$f" >> /tmp/core-files.sha256; done
          sort -k2 /tmp/core-files.sha256 -o /tmp/core-files.sha256
          count=$(wc -l < /tmp/core-files.sha256 | tr -d ' ')
          aggregate=$(sha256sum /tmp/core-files.sha256 | awk '{print $1}')
          echo "core_file_count=$count"
          echo "core_manifest_sha256=$aggregate"
          test "$count" = '83'
          test "$aggregate" = '2eb6f67a0fe4907ec5b517826763c2c6f62ae889209fa4670780f7043ddd8994'
          echo 'MERGED_CORE_VERIFIED=1' >> "$GITHUB_ENV"
          echo 'Merged recovery matches audited local kit exactly.'

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Recuperação combinada do payload OficinaOS-V1'
            echo
            echo "- Core combinado verificado: ${MERGED_CORE_VERIFIED:-0}"
            echo '- Arquivos esperados no core: 83'
            echo '- SHA-256 esperado do manifesto: `2eb6f67a0fe4907ec5b517826763c2c6f62ae889209fa4670780f7043ddd8994`'
            echo
            echo '### ZIP recuperado'
            echo '```'; cat /tmp/zip-files.txt 2>/dev/null || true; echo '```'
            echo '### XZ recuperado'
            echo '```'; cat /tmp/xz-files.txt 2>/dev/null || true; echo '```'
            echo '### Conjunto mesclado'
            echo '```'; cat /tmp/merged-files.txt 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
