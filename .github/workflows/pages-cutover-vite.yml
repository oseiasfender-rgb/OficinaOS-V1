name: Cutover GitHub Pages to Vite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-cutover-vite.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch Pages source to GitHub Actions
        uses: actions/github-script@v8
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow',
              headers: { 'X-GitHub-Api-Version': '2026-03-10' }
            })

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build Vite production artifact
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify dist PWA shell
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/service-worker.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -d dist/assets

      - name: Upload dist only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: cutover
    steps:
      - name: Deploy Vite dist to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
