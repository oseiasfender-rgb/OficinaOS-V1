name: Refresh PWA Release Manifest

on:
  push:
    branches:
      - producao/pwa-github-pages-rc1
    paths:
      - '.github/workflows/refresh-pwa-release-manifest.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: producao/pwa-github-pages-rc1
          fetch-depth: 0
      - name: Regenerate production source manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/workflows/*' \
            ! -name 'RELEASE_SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > RELEASE_SHA256SUMS.txt
          test -s RELEASE_SHA256SUMS.txt
          sha256sum -c RELEASE_SHA256SUMS.txt
      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
            exit 0
          fi
          git commit -m 'chore(pwa): refresh frozen source manifest'
          git push origin HEAD:producao/pwa-github-pages-rc1
