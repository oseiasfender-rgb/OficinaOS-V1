name: Freeze OficinaOS Official Tag

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/oficinaos-v0.9.1-rc1
    paths:
      - '.github/workflows/freeze-release-tag.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG_NAME: v0.9.1-rc1
      EXPECTED_MAIN_SHA: 5442b352cb80ec74bf6581847e5a7e0529a3d88f
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact homologated main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN_SHA"
          echo "main verified at $actual"

      - name: Create immutable annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$TAG_NAME")"
            test "$existing" = "$EXPECTED_MAIN_SHA"
            echo "$TAG_NAME already exists and points to approved commit $existing"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG_NAME" "$EXPECTED_MAIN_SHA" -m 'OficinaOS v0.9.1 RC1 — Homologação Externa Final GO' -m 'Merge aprovado: PR #1. Snapshot saneado homologado; 11 vínculos fromTx sem destino removidos, campos financeiros preservados. GitHub Actions de homologação: 37465897760. CI da release: 37469004204 e 37469238940.'
          git push origin "refs/tags/$TAG_NAME"
          echo "Created $TAG_NAME -> $EXPECTED_MAIN_SHA"
