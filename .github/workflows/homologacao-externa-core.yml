name: OficinaOS External Final Homologation Core

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/oficinaos-v0.9.1-rc1
    paths:
      - '.ci5/**'
      - '.github/workflows/homologacao-externa-core.yml'

permissions:
  contents: read

jobs:
  homologate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      OFICINAOS_BASE_URL: http://127.0.0.1:4173/
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct audited core payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ci5/core83.part-00.b64 .ci5/core83.part-01.b64 .ci5/core83.part-02.b64 .ci5/core83.part-03.b64 | tr -d '\r\n' | base64 --decode > /tmp/core83.tar.xz
          echo '3098dc255631212bf4a8adf78b2c36cad90b36872ed9d426d648ebb370a9511e  /tmp/core83.tar.xz' | sha256sum -c -
          xz -t /tmp/core83.tar.xz
          mkdir -p /tmp/oficinaos
          tar -xJf /tmp/core83.tar.xz -C /tmp/oficinaos

      - name: Verify exact audited core
        working-directory: /tmp/oficinaos
        shell: bash
        run: |
          set -euo pipefail
          find src tests scripts public homologation/fixtures -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/core-files.sha256
          for f in package.json index.html vite.config.js GITHUB_TARGET.md; do sha256sum "$f" >> /tmp/core-files.sha256; done
          sort -k2 /tmp/core-files.sha256 -o /tmp/core-files.sha256
          test "$(wc -l < /tmp/core-files.sha256 | tr -d ' ')" = '83'
          test "$(sha256sum /tmp/core-files.sha256 | awk '{print $1}')" = '2eb6f67a0fe4907ec5b517826763c2c6f62ae889209fa4670780f7043ddd8994'

      - name: Apply versioned homologation corrections
        working-directory: /tmp/oficinaos
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE/.ci5/overrides/." /tmp/oficinaos/
          sha256sum -c "$GITHUB_WORKSPACE/.ci5/overrides.sha256"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/patched-files.sha256
          mkdir -p homologation/external-results

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned dependencies
        working-directory: /tmp/oficinaos
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: /tmp/oficinaos
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        id: unit
        working-directory: /tmp/oficinaos
        run: npm test

      - name: Service-level functional homologation
        id: functional
        working-directory: /tmp/oficinaos
        run: npm run homologate:functional -- homologation/external-results/functional.json homologation/external-results/functional.md

      - name: Vite build
        id: build
        working-directory: /tmp/oficinaos
        run: npm run build

      - name: Generate isolated CLEAN synthetic fixture
        working-directory: /tmp/oficinaos
        run: npm run homologate:fixture

      - name: Start Vite preview
        working-directory: /tmp/oficinaos
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > homologation/external-results/vite-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat homologation/external-results/vite-preview.log
          exit 1

      - name: Browser IndexedDB reload PDF and full-store export reimport
        working-directory: /tmp/oficinaos
        run: npm run homologate:browser -- homologation/fixtures/external-smoke-backup.json homologation/external-results/browser.json homologation/external-results/browser.md

      - name: PDF and round-trip with zero saved budgets
        working-directory: /tmp/oficinaos
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('homologation/fixtures/external-smoke-backup.json','utf8')); if(p.modular?.stores){p.modular.stores.budgets=[];p.modular.stores.budgetHistory=[];p.modular.stores.archivedBudgets=[];} p.orcHistorico=[]; fs.writeFileSync('homologation/fixtures/zero-budget-smoke.json',JSON.stringify(p));"
          node scripts/homologate-browser.mjs homologation/fixtures/zero-budget-smoke.json homologation/external-results/zero-budget/browser.json homologation/external-results/zero-budget/browser.md

      - name: Final decision from actual evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        working-directory: /tmp/oficinaos
        env:
          UNIT_PASS: ${{ steps.unit.outcome == 'success' && '1' || '0' }}
          BUILD_PASS: ${{ steps.build.outcome == 'success' && '1' || '0' }}
          FUNCTIONAL_PASS: ${{ steps.functional.outcome == 'success' && '1' || '0' }}
        run: npm run homologate:external:final

      - name: Preserve synthetic evidence and manifests
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/homologation-evidence"
          if [ -d /tmp/oficinaos/homologation/external-results ]; then
            cp -a /tmp/oficinaos/homologation/external-results/. "$GITHUB_WORKSPACE/homologation-evidence/"
          fi
          for f in /tmp/core-files.sha256 /tmp/patched-files.sha256; do
            if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/homologation-evidence/"; fi
          done
          cp "$GITHUB_WORKSPACE/.ci5/overrides.sha256" "$GITHUB_WORKSPACE/homologation-evidence/overrides.sha256"
          sha256sum /tmp/core83.tar.xz > "$GITHUB_WORKSPACE/homologation-evidence/core83.tar.xz.sha256" 2>/dev/null || true
          if [ -f /tmp/oficinaos/HOMOLOGATION_CORRECTIONS_2026-10-05.md ]; then
            cp /tmp/oficinaos/HOMOLOGATION_CORRECTIONS_2026-10-05.md "$GITHUB_WORKSPACE/homologation-evidence/"
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/oficinaos/homologation/external-results/FINAL_EXTERNAL_HOMOLOGATION.md ]; then
            cat /tmp/oficinaos/homologation/external-results/FINAL_EXTERNAL_HOMOLOGATION.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NO-GO: evidência técnica incompleta; consultar a etapa que falhou.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oficinaos-external-final-evidence
          path: homologation-evidence/
          if-no-files-found: error
